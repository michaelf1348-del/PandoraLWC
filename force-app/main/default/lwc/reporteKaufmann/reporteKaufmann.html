                                <lightning-button-icon icon-name="utility:close" variant="bare" onclick={closeTableSearch} alternative-text="Cerrar búsqueda" title="Cerrar (Esc)"></lightning-button-icon>
                            </div>
                        </template>

                        <!-- LIENZO CENTRAL -->
                        <div class={excelPreviewCanvasClasses} style="position: relative;" ondragover={handleColumnDragOver} ondrop={handleCanvasDrop} onscroll={handleCanvasScroll}>
                            <template if:false={excelPreviewVisible}>
                                <div class="empty-state">
                                    <div class="empty-icon-wrapper">📄</div>
                                    <h2>Lienzo Vacío</h2>
                                    <p>Activa columnas en el panel izquierdo o configura pivots en una hoja resumen.</p>
                                </div>
                            </template>
                            
                            <template if:true={excelPreviewVisible}>
                                <!-- R4: wrapper de zoom (no afecta el scroll del lienzo). -->
                                <div class="canvas-zoom-wrap" style={previewZoomStyle}>
                                <template if:true={activeSheet.settings.logoBase64}>
                                    <!-- Y2/Y3: logo arrastrable y redimensionable.
                                         · Click + drag sobre la imagen → mueve el logo.
                                         · Click + drag sobre el cuadradito ⤡ (esquina SE) → redimensiona. -->
                                    <div class="logo-floating" style={previewLogoContainerStyle} onmousedown={handleLogoMouseDown} title="Arrastra para mover · Arrastra la esquina ⤡ para redimensionar">
                                        <img src={activeSheet.settings.logoBase64} style={previewLogoImgStyle} alt="Logo" />
                                        <span class="logo-floating__resize" onmousedown={handleLogoResizeMouseDown} title="Arrastra para redimensionar" aria-label="Redimensionar logo">⤡</span>
                                    </div>
                                </template>

                                <!-- TABLA DE DETALLE -->
                                <template if:true={isTableSheet}>
                                    <div style={previewTableOffsetStyle} class={previewTableShellWrapClass} onmousedown={handleTableMoveMouseDown}>
                                        <div class={excelPreviewTableShellClass}>
                                        <table class={excelPreviewMainTableClass}>
                                            <thead>
                                                <tr>
                                                    <template for:each={previewColumns} for:item="col">
                                                        <th key={col.apiName} class={col.thClass} style={col.headerStyle} draggable="true" data-api-name={col.apiName} ondragstart={handleColumnDragStart} ondragover={handleColumnDragOver} ondrop={handleColumnDrop} onclick={selectColumnFromEvent} ondblclick={handleVirtualColumnDblClick}>
                                                            <template if:true={col.isVirtual}><span style="margin-right:4px;" title="Doble-click para editar fórmula">✨</span></template>
                                                            <span class="th-label">{col.alias}</span>
                                                            <!-- Click en este botón cicla ASC → DESC → sin orden. -->
                                                            <button type="button" class={col.sortBtnClass} data-api-name={col.apiName} onclick={handleHeaderSort} title={col.sortBtnTitle} aria-label="Cambiar orden de la columna">{col.sortIndicator}</button>
                                                            <!-- V3: AutoFiltro tipo Excel. Click abre dropdown con valores únicos + checkboxes. -->
                                                            <button type="button" class={col.filterBtnClass} data-api-name={col.apiName} onclick={openHeaderFilter} title={col.filterBtnTitle} aria-label="Filtrar valores de la columna">▾</button>
                                                            <span class="resize-handle" data-api-name={col.apiName} onmousedown={startColumnResize}></span>
                                                            <template if:true={col.isFirst}><span class="resize-handle-y" onmousedown={startHeaderResize}></span></template>
                                                        </th>
                                                    </template>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={previewRows} for:item="row">
                                                    <tr key={row.id} style={row.rowStyle}>
                                                        <template for:each={row.cells} for:item="cell">
                                                            <td key={cell.key}
                                                                class={cell.cellClass}
                                                                style={cell.style}
                                                                data-api-name={cell.apiName}
                                                                data-raw-value={cell.rawValue}
                                                                title={cell.titleHint}
                                                                ondblclick={handleVirtualColumnDblClick}
                                                                oncontextmenu={handleCellContextMenu}>{cell.value}<template if:true={cell.showYResize}><span class="resize-handle-y" onmousedown={startRowResize}></span></template></td>
                                                        </template>
                                                    </tr>
                                                </template>
                                                <template if:true={activeSheet.settings.showTotals}>
                                                    <tr style="height: 28px; background-color: #f8fafc; font-weight: bold;">
                                                        <template for:each={previewTotalsRow} for:item="tot">
                                                            <td key={tot.id} style={tot.style}>{tot.value}</td>
                                                        </template>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                        </div>
                                    </div>
                                </template>

                                <template if:true={isSummarySheet}>
                                    <div class="slds-m-bottom_medium slds-text-heading_small" style="color: #64748b; font-weight: bold; border-bottom: 2px dashed #cbd5e1; padding-bottom: 8px;">
                                        Hoja de Resumen (Mostrando solo Tablas Pivot)
                                    </div>
                                </template>

                                <!-- F5: Gráficos de la hoja activa renderizados como <canvas> con Chart.js. -->
                                <template if:true={hasActiveSheetCharts}>
                                    <div class="charts-wrapper slds-m-top_large">
                                        <template for:each={activeSheetCharts} for:item="ch">
                                            <div key={ch.id} class="chart-card">
                                                <div class="chart-card__header">
                                                    <span class="chart-card__title">{ch.title}</span>
                                                    <span class="chart-card__type">{ch.typeLabel}</span>
                                                </div>
                                                <div class="chart-card__body">
                                                    <canvas data-chart-id={ch.id}></canvas>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template for:each={subTablePreviews} for:item="subPrev">
                                    <div key={subPrev.id} class="slds-m-top_large pivot-preview-wrapper" style="display: block; margin-bottom: 16px;">
                                        <div style="display: flex; align-items: center; justify-content: space-between; max-width: 100%; margin-bottom: 8px;">
                                            <h3 class="pivot-preview-title" style={subPrev.customFontStyle}>{subPrev.title}</h3>
                                            <span class="slds-badge pivot-badge">Orientación: {subPrev.orientationLabel}</span>
                                        </div>

                                        <template if:true={subPrev.isVertical}>
                                            <table class="preview-table" style={subPrev.customTableWidthStyle}>
                                                <thead><tr><th style={subPrev.headerStyle}>Categoría (Fila)</th><th style={subPrev.headerStyle}>{subPrev.metricLabel}</th></tr></thead>
                                                <tbody>
                                                    <template for:each={subPrev.rows} for:item="sumRow">
                                                        <tr key={sumRow.key}><td style={sumRow.styleL}>{sumRow.label}</td><td style={sumRow.styleC}>{sumRow.metricValue}</td></tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </template>

                                        <template if:false={subPrev.isVertical}>
                                            <div class="slds-scrollable_x">
                                                <table class="preview-table" style={subPrev.customTableWidthStyle}>
                                                    <thead><tr><template for:each={subPrev.horizontalHeaders} for:item="hh"><th key={hh} style={subPrev.headerStyle}>{hh}</th></template></tr></thead>
                                                    <tbody><tr><template for:each={subPrev.horizontalValues} for:item="hv"><td key={hv} style={subPrev.dataStyleCenter}>{hv}</td></template></tr></tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                </div><!-- /canvas-zoom-wrap (R4) -->
                            </template>
                        </div>

                        <div class="bottom-tabs">
                            <template for:each={decoratedSheets} for:item="sheet">
                                <div key={sheet.id}
                                     class={sheet.wrapClass}
                                     draggable="true"
                                     data-sheet-id={sheet.id}
                                     ondragstart={handleSheetDragStart}
                                     ondragover={handleSheetDragOver}
                                     ondragleave={handleSheetDragLeave}
                                     ondragend={handleSheetDragEnd}
                                     ondrop={handleSheetDrop}>
                                    <button class={sheet.tabClass} data-sheet-id={sheet.id} onclick={setActiveSheetFromEvent} title="Arrastra para reordenar; clic para activar la hoja">{sheet.name}</button>
                                    <button class="tab-close" title="Eliminar hoja" data-sheet-id={sheet.id} onclick={deleteSheetFromEvent}>×</button>
                                </div>
                            </template>
                            <button class="sheet-tab add-tab" onclick={openNewSheetModal}>+ Añadir Hoja</button>
                        </div>
                    </template>
                </main>

                <!-- PANEL DERECHO -->
                <aside class="right-panel">
                    <template if:true={hasActiveSheet}>
                        <template if:true={selectedColumn}>
                            <div class="ux-panel-header">
                                <lightning-button-icon icon-name="utility:back" variant="bare" onclick={deselectColumn} size="large" alternative-text="Volver a propiedades de hoja" class="slds-m-right_small"></lightning-button-icon>
                                <div>
                                    <div class="ux-header-subtitle">Configuración de columna</div>
                                    <div class="ux-header-title">{selectedColumn.label}</div>
                                </div>
                            </div>
                            <!-- U5: rediseño del panel de columna seleccionada.
                                 Sin tabs: se ven todas las opciones como cards verticales
                                 (General · Apariencia · Formato de datos). Conserva los mismos
                                 handlers que el combobox anterior, solo cambia la presentación. -->
                            <div class="ux-panel-body">
                                <div class="ux-card">
                                    <div class="ux-section-title">
                                        <span class="section-icon"><lightning-icon icon-name="utility:rows" size="xx-small" alternative-text=""></lightning-icon></span>
                                        <span>General</span>
                                    </div>
                                    <lightning-input
                                        label="Nombre visible"
                                        value={selectedColumn.alias}
                                        data-field="alias"
                                        onchange={handleSelectedColumnChange}
                                        placeholder="Alias de columna…">
                                    </lightning-input>
                                    <lightning-slider class="slds-m-top_small" label="Ancho de columna (px)" min="70" max="520" value={selectedColumn.width} data-field="width" onchange={handleSelectedColumnChange}></lightning-slider>
                                </div>

                                <div class="ux-card slds-m-top_medium">
                                    <div class="ux-section-title">
                                        <span class="section-icon"><lightning-icon icon-name="utility:palette" size="xx-small" alternative-text=""></lightning-icon></span>
                                        <span>Apariencia</span>
                                    </div>
                                    <div class="color-grid">
                                        <lightning-input type="color" label="Fondo Header" value={selectedColumn.headerColor} data-field="headerColor" onchange={handleSelectedColumnChange}></lightning-input>
                                        <lightning-input type="color" label="Texto Header" value={selectedColumn.headerTextColor} data-field="headerTextColor" onchange={handleSelectedColumnChange}></lightning-input>
                                        <lightning-input type="color" label="Fondo Datos" value={selectedColumn.dataColor} data-field="dataColor" onchange={handleSelectedColumnChange}></lightning-input>
                                        <lightning-input type="color" label="Texto Datos" value={selectedColumn.textColor} data-field="textColor" onchange={handleSelectedColumnChange}></lightning-input>
                                    </div>
                                </div>

                                <div class="ux-card slds-m-top_medium">
                                    <div class="ux-section-title">
                                        <span class="section-icon"><lightning-icon icon-name="utility:chart" size="xx-small" alternative-text=""></lightning-icon></span>
                                        <span>Formato de datos</span>
                                    </div>
                                    <div class="format-chip-row" role="radiogroup" aria-label="Tipo de formato de la columna">
                                        <template for:each={formatChoices} for:item="chip">
                                            <button type="button"
                                                    key={chip.value}
                                                    role="radio"
                                                    aria-checked={chip.ariaChecked}
                                                    class={chip.chipClass}
                                                    data-format={chip.value}
                                                    title={chip.hint}
                                                    onclick={setFormatChoice}>
                                                <lightning-icon icon-name={chip.icon} size="x-small" alternative-text=""></lightning-icon>
                                                <span>{chip.label}</span>
                                            </button>
                                        </template>
                                    </div>
                                    <!-- Formato de fecha por columna: aparece solo si la columna es DATE/DATETIME (por dataType,
                                         por formato manual, o por nombre del campo). Se aplica al preview, Excel y PDF. -->
                                    <template if:true={isSelectedColumnDateLike}>
                                        <lightning-combobox
                                            class="slds-m-top_small"
                                            label="Formato de fecha"
                                            options={dateFormatOptions}
                                            value={selectedColumn.dateFormat}
                                            data-field="dateFormat"
                                            onchange={handleSelectedColumnChange}
                                            placeholder="Predeterminado del sistema"
                                            field-level-help="Cambia cómo se muestra la fecha en la vista previa y en Excel/PDF. 'Predeterminado' usa el locale del navegador.">
                                        </lightning-combobox>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <template if:false={selectedColumn}>
                            <div class="ux-panel-header ux-panel-header--global">
                                <div class="ux-panel-header__icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:settings" size="small" alternative-text=""></lightning-icon>
                                </div>
                                <div class="ux-panel-header__text">
                                    <div class="ux-header-subtitle">Configuración del reporte</div>
                                    <div class="ux-header-title">{activeSheet.name}</div>
                                </div>
                            </div>

                            <!-- Ola 3: sub-tabs del panel derecho.
                                 Reorganizan los bloques existentes en 4 grupos. NO cambian
                                 ningún handler ni propiedad: solo controlan qué se ve. -->
                            <nav class="panel-tabs" role="tablist" aria-label="Secciones de configuración">
                                <button type="button" role="tab" class={panelTabGeneralClass} data-paneltab="general" onclick={setPanelTab} title="Nombre, tipo y orden de la hoja">General</button>
                                <button type="button" role="tab" class={panelTabFormatoClass} data-paneltab="formato" onclick={setPanelTab} title="Apariencia: colores, fuente, vista previa y logo">Formato</button>
                                <button type="button" role="tab" class={panelTabFiltrosClass} data-paneltab="filtros" onclick={setPanelTab} title="Reglas que filtran las filas de esta hoja">Filtros</button>
                                <button type="button" role="tab" class={panelTabExportClass} data-paneltab="export" onclick={setPanelTab} title="Tablas pivot y combinar datos de otro reporte">Más</button>
                            </nav>

                            <div class="ux-panel-body">
                                <!-- Warning siempre visible: una mala configuración no debería ser fácil de ignorar. -->
                                <template if:true={hasSheetConfigWarnings}>
                                    <div class="hint-box slds-m-bottom_medium">
                                        ⚠️ {sheetConfigWarningText}
                                    </div>
                                </template>

                                <!-- ───── TAB GENERAL ─────
                                     Rediseño U2-rev2: cards con icono en caja azul + cabecera con
                                     separador. Layout responsivo en 2 columnas para "Ordenar por /
                                     Dirección" emulando el mockup, sin añadir features nuevas. -->
                                <template if:true={isPanelTabGeneral}>
                                    <div class="ux-card">
                                        <div class="ux-section-title">
                                            <span class="section-icon"><lightning-icon icon-name="utility:rows" size="xx-small" alternative-text=""></lightning-icon></span>
                                            <span>General</span>
                                        </div>
                                        <lightning-input label="Nombre de la hoja" value={activeSheet.name} onchange={handleActiveSheetNameChange}></lightning-input>
                                        <lightning-combobox class="slds-m-top_small" label="Tipo de vista" options={sheetTypeOptions} value={activeSheet.type} onchange={handleActiveSheetTypeChange}></lightning-combobox>
                                    </div>

                                    <template if:true={isTableSheet}>
                                        <div class="ux-card slds-m-top_medium">
                                            <div class="ux-section-title">
                                                <span class="section-icon"><lightning-icon icon-name="utility:sort" size="xx-small" alternative-text=""></lightning-icon></span>
                                                <span>Orden y totales</span>
                                            </div>
                                            <div class="two-columns">
                                                <lightning-combobox label="Ordenar por" options={summaryOptions} value={activeSheet.settings.sortBy} onchange={handleSortByChange}></lightning-combobox>
                                                <template if:true={activeSheet.settings.sortBy}>
                                                    <lightning-combobox label="Dirección" options={sortDirectionOptions} value={activeSheet.settings.sortDirection} onchange={handleSortDirChange}></lightning-combobox>
                                                </template>
                                            </div>
                                            <div class="toggle-stack slds-m-top_small">
                                                <lightning-input type="toggle" label="Mostrar Fila de Totales" checked={activeSheet.settings.showTotals} onchange={handleShowTotalsChange} message-toggle-active="" message-toggle-inactive=""></lightning-input>
                                                <!-- Ver conteo de registros: chip en el breadcrumb del lienzo. -->
                                                <lightning-input type="toggle" label="Ver conteo de registros" checked={showRowCountChecked} onchange={handleShowRowCountChange} message-toggle-active="" message-toggle-inactive="" field-level-help="Muestra el número total de filas (tras filtros) como chip en el lienzo. No afecta a Excel/PDF/PPT."></lightning-input>
                                            </div>
                                        </div>

                                        <!-- X6: auto-fit anchos de columna basado en contenido. -->
                                        <div class="ux-card slds-m-top_medium">
                                            <div class="ux-section-title">
                                                <span class="section-icon"><lightning-icon icon-name="utility:expand_alt" size="xx-small" alternative-text=""></lightning-icon></span>
                                                <span>Anchos de columna</span>
                                            </div>
                                            <p class="ux-card__lead">Ajusta automáticamente el ancho de cada columna visible según su contenido.</p>
                                            <lightning-button variant="brand-outline" label="Auto-ajustar anchos" icon-name="utility:resize" onclick={autoFitColumnWidths} class="full-width-btn"></lightning-button>
                                        </div>
                                    </template>

                                </template>

                                <!-- ───── TAB FORMATO ───── -->
                                <template if:true={isPanelTabFormato}>
                                    <template if:true={isTableSheet}>
                                        <div class="ux-card">
                                            <div class="ux-section-title">
                                                <span class="section-icon"><lightning-icon icon-name="utility:preview" size="xx-small" alternative-text=""></lightning-icon></span>
                                                <span>Vista previa (lienzo)</span>
                                            </div>
                                            <lightning-combobox label="Texto en tabla" options={previewFontScaleOptions} value={activePreviewFontScaleValue} onchange={handlePreviewFontScaleChange} field-level-help="Solo afecta la tabla central; Excel/PDF siguen usando el tamaño de exportación habitual."></lightning-combobox>
                                            <div class="toggle-stack slds-m-top_small">
                                                <lightning-input type="toggle" label="Celdas vacías sin guión" checked={blankHyphenAsEmptyChecked} onchange={handleBlankHyphenAsEmptyChange} message-toggle-active="" message-toggle-inactive="" field-level-help="Si el informe devuelve «-» o guión para huecos, la vista previa y la exportación muestran celda en blanco (puedes desactivarlo para ver el texto original)."></lightning-input>
                                                <lightning-input type="toggle" label="Ajustar texto (varias líneas)" checked={activeSheet.settings.previewCellWrapWords} onchange={handlePreviewCellWrapWordsChange} message-toggle-active="" message-toggle-inactive="" field-level-help="Las celdas se muestran con texto en múltiples líneas. Se aplica también al Excel y PDF exportados."></lightning-input>
                                                <!-- X2: Filas alternadas (zebra striping). -->
                                                <lightning-input type="toggle" label="Filas alternadas (banding)" checked={bandedRowsChecked} onchange={handleBandedRowsChange} message-toggle-active="" message-toggle-inactive="" field-level-help="Aplica un color de fondo alternado a filas pares. Solo en celdas sin color de columna personalizado. Se replica en Excel y PDF."></lightning-input>
                                            </div>
                                            <template if:true={bandedRowsChecked}>
                                                <lightning-input class="slds-m-top_small" type="color" label="Color de banda" value={bandedRowColorValue} onchange={handleBandedRowColorChange}></lightning-input>
                                            </template>
                                            <!-- X4: altura de cabecera y de fila configurables por hoja. -->
                                            <div class="two-columns slds-m-top_small">
                                                <lightning-slider label="Alto de cabecera (px)" min="20" max="80" step="2" value={activeSheet.settings.headerHeight} onchange={handleHeaderHeightChange} field-level-help="Aplica a preview y Excel exportado."></lightning-slider>
                                                <lightning-slider label="Alto de fila (px)" min="18" max="80" step="2" value={activeSheet.settings.dataRowHeight} onchange={handleDataRowHeightChange} field-level-help="Aplica a preview y Excel exportado (mínimo cuando 'Ajustar texto' está activo)."></lightning-slider>
                                            </div>
                                        </div>

                                        <template if:true={isAdvancedMode}>
                                            <div class="ux-card slds-m-top_medium">
                                                <div class="ux-section-title">
                                                    <span class="section-icon"><lightning-icon icon-name="utility:palette" size="xx-small" alternative-text=""></lightning-icon></span>
                                                    <span>Colores y fuente</span>
                                                </div>
                                                <lightning-combobox label="Fuente del reporte" options={fontOptions} value={workbookConfig.theme.font} onchange={handleGlobalFontChange} class="slds-m-bottom_small"></lightning-combobox>
                                                <div class="color-grid">
                                                    <lightning-input type="color" label="Fondo Enc." value={globalHeaderColorValue} onchange={handleGlobalHeaderColorChange}></lightning-input>
                                                    <lightning-input type="color" label="Texto Enc." value={globalHeaderTextColorValue} onchange={handleGlobalHeaderTextColorChange}></lightning-input>
                                                    <lightning-input type="color" label="Fondo Filas" value={globalDataColorValue} onchange={handleGlobalDataColorChange}></lightning-input>
                                                    <lightning-input type="color" label="Texto Filas" value={globalDataTextColorValue} onchange={handleGlobalDataTextColorChange}></lightning-input>
                                                </div>
                                            </div>

                                            <!-- X8: Bordes tipo Excel — afecta a preview, Excel y PDF. -->
                                            <div class="ux-card slds-m-top_medium">
                                                <div class="ux-section-title">
                                                    <span class="section-icon"><lightning-icon icon-name="utility:table" size="xx-small" alternative-text=""></lightning-icon></span>
                                                    <span>Bordes</span>
                                                </div>
                                                <lightning-combobox
                                                    label="Estilo de borde"
                                                    options={borderStyleOptions}
                                                    value={borderStyleValue}
                                                    onchange={handleBorderStyleChange}
                                                    field-level-help="Replica la herramienta Bordes de Excel. Se aplica a la vista previa, al Excel y al PDF exportados."></lightning-combobox>
                                                <div class="two-columns slds-m-top_small">
                                                    <lightning-input type="color" label="Color del borde" value={borderColorValue} onchange={handleBorderColorChange}></lightning-input>
                                                    <lightning-slider label="Grosor (px)" min="1" max="3" step="1" value={borderWidthValue} onchange={handleBorderWidthChange} field-level-help="1 = fino, 2 = medio, 3 = grueso."></lightning-slider>
                                                </div>
                                            </div>
                                        </template>
                                    </template>

                                    <template if:true={isAdvancedMode}>
                                        <div class="ux-card slds-m-top_medium">
                                            <div class="ux-section-title">
                                                <span class="section-icon"><lightning-icon icon-name="utility:image" size="xx-small" alternative-text=""></lightning-icon></span>
                                                <span>Logo y tabla en Excel/PDF</span>
                                            </div>
                                            <lightning-input type="file" label="Logo en el encabezado" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" onchange={handleLogoUpload}></lightning-input>
                                            <p class="slds-m-top_xx-small" style="font-size:10px;color:var(--pandora-text-muted);">PNG/JPEG/WebP/GIF, máx. ~1,8&nbsp;MB. Se normaliza a PNG (máx. 1280&nbsp;px) para previsualización y Excel/PDF.</p>
                                            <template if:true={activeSheet.settings.logoBase64}>
                                                <div class="logo-remove-box slds-m-vertical_small">
                                                    <lightning-button variant="destructive-text" label="Quitar logo" onclick={removeLogo}></lightning-button>
                                                </div>
                                                <div class="two-columns slds-m-top_small">
                                                    <lightning-input type="text" label="Columna" value={activeSheet.settings.logoCol} onchange={handleLogoColChange}></lightning-input>
                                                    <lightning-input type="number" label="Fila" value={activeSheet.settings.logoRow} onchange={handleLogoRowChange}></lightning-input>
                                                </div>
                                            </template>
                                            <lightning-input class="slds-m-top_small" type="number" label="Fila de inicio de tabla" value={activeSheet.settings.tableStartRow} onchange={handleTableStartRowChange} min="1"></lightning-input>
                                        </div>
                                    </template>

                                    <template if:true={showPanelFormatoEmpty}>
                                        <div class="hint-box">
                                            Esta hoja de tipo resumen no tiene opciones de formato aquí. Activa la <strong>experiencia libro multi-hoja</strong> en la tab <em>General</em> para mostrar opciones avanzadas (logo, fuente, colores).
                                        </div>
                                    </template>
                                </template>

                                <!-- ───── TAB FILTROS ───── -->
                                <template if:true={isPanelTabFiltros}>
                                    <div class="ux-card filter-chips-card">
                                        <div class="ux-section-title">
                                            <span class="section-icon"><lightning-icon icon-name="utility:filter" size="xx-small" alternative-text=""></lightning-icon></span>
                                            <span>Filtros activos</span>
                                        </div>
                                        <template if:true={hasActiveFilterChips}>
                                            <ul class="filter-chip-list" role="list">
                                                <template for:each={activeFilterChips} for:item="chip">
                                                    <li key={chip.id} class="filter-chip" title={chip.title}>
                                                        <span class="filter-chip__dot" aria-hidden="true"></span>
                                                        <span class="filter-chip__label">{chip.label}</span>
                                                        <button type="button" class="filter-chip__remove" data-fid={chip.id} onclick={removeSheetFilter} title="Quitar este filtro" aria-label="Quitar filtro">×</button>
                                                    </li>
                                                </template>
                                            </ul>
                                        </template>
                                        <template if:false={hasActiveFilterChips}>
                                            <p class="filter-chips-empty">Sin filtros activos en esta hoja.</p>
                                        </template>
                                        <div class="filter-chips-actions">
                                            <lightning-button variant="neutral" label="+ Agregar filtro" onclick={openFiltersModal} title="Abre el editor de filtros con operadores avanzados (contiene, vacío, rango...)"></lightning-button>
                                            <template if:true={hasActiveFilterChips}>
                                                <lightning-button variant="base" label="Editar todos" icon-name="utility:edit" onclick={openFiltersModal} title="Abrir el editor completo"></lightning-button>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- ───── TAB MÁS ───── -->
                                <template if:true={isPanelTabExport}>
                                    <!-- X7: vista previa de impresión + ajustes PDF. -->
                                    <div class="ux-card">
                                        <div class="ux-section-title">
                                            <span class="section-icon"><lightning-icon icon-name="utility:print" size="xx-small" alternative-text=""></lightning-icon></span>
                                            <span>Impresión / PDF</span>
                                        </div>
                                        <lightning-combobox label="Orientación" options={pdfOrientationOptions} value={pdfOrientationValue} onchange={handlePdfOrientationChange}></lightning-combobox>
                                        <lightning-combobox class="slds-m-top_x-small" label="Márgenes" options={pdfMarginOptions} value={pdfMarginValue} onchange={handlePdfMarginChange}></lightning-combobox>
                                        <lightning-button class="slds-m-top_small full-width-btn" variant="brand-outline" label="Vista previa de impresión" icon-name="utility:preview" onclick={openPrintPreviewModal}></lightning-button>
                                    </div>

                                    <template if:true={isAdvancedMode}>
                                        <div class="ux-card">
                                            <div class="pivot-section-toolbar slds-m-bottom_small">
                                                <span class="ux-section-title pivot-section-toolbar__title">
                                                    <span class="section-icon"><lightning-icon icon-name="utility:chart" size="xx-small" alternative-text=""></lightning-icon></span>
                                                    <span>Tablas pivot</span>
                                                </span>
                                                <lightning-button
                                                    variant="neutral"
                                                    label="Añadir pivot"
                                                    icon-name="utility:add"
                                                    onclick={handleAddSubTable}
                                                    title="Crea una subtabla de resumen (pivot)"
                                                ></lightning-button>
                                            </div>
                                            <template if:false={decoratedSubTables.length}><div class="hint-box slds-m-top_small">No hay resúmenes pivot. Pulsa «Añadir pivot» para crear uno.</div></template>
                                            <template for:each={decoratedSubTables} for:item="sub">
                                                <div key={sub.id} class="pivot-config-card slds-m-top_small">
                                                    <div class="pivot-header">
                                                        <span class="pivot-title">{sub.titleDisplay}</span>
                                                        <lightning-button-icon icon-name="utility:delete" variant="bare" size="small" data-id={sub.id} alternative-text="Eliminar tabla pivot" onclick={handleRemoveSubTable}></lightning-button-icon>
                                                    </div>

                                                    <lightning-input label="Nombre de la Tabla (Opcional)" value={sub.title} data-id={sub.id} data-field="title" onchange={handleSubTableChange} placeholder="Ej: Demanda por Estado" class="slds-m-bottom_x-small"></lightning-input>
                                                    <lightning-combobox label="Tipo de letra" options={fontOptions} value={sub.font} data-id={sub.id} data-field="font" onchange={handleSubTableChange} class="slds-m-bottom_x-small"></lightning-combobox>

                                                    <lightning-combobox label="Agrupar por" options={summaryOptions} value={sub.groupByField} data-id={sub.id} data-field="groupByField" onchange={handleSubTableChange}></lightning-combobox>
                                                    <lightning-combobox class="slds-m-top_x-small" label="Operación" options={operationOptions} value={sub.operation} data-id={sub.id} data-field="operation" onchange={handleSubTableChange}></lightning-combobox>
                                                    <template if:true={sub.needsMetricField}><lightning-combobox class="slds-m-top_x-small" label="Campo a Calcular" options={numericSummaryOptions} value={sub.metricField} data-id={sub.id} data-field="metricField" onchange={handleSubTableChange}></lightning-combobox></template>
                                                    <lightning-combobox class="slds-m-top_x-small" label="Orientación" options={orientationOptions} value={sub.orientation} data-id={sub.id} data-field="orientation" onchange={handleSubTableChange}></lightning-combobox>
                                                    <template if:true={sub.groupByField}>
                                                        <lightning-input type="number" class="slds-m-top_small" label="Fila en Excel (opcional)" value={sub.excelStartRow} data-id={sub.id} data-field="excelStartRow" onchange={handleSubTableChange} min="1" field-level-help="Vacío: el pivot va debajo de la tabla. Con número: se intenta anclar el bloque a esa fila."></lightning-input>
                                                    </template>

                                                    <div class="two-columns slds-m-top_small">
                                                        <lightning-combobox label="Ordenar por" options={pivotSortByOptions} value={sub.sortBy} data-id={sub.id} data-field="sortBy" onchange={handleSubTableChange}></lightning-combobox>
                                                        <lightning-combobox label="Dirección" options={sortDirectionOptions} value={sub.sortDirection} data-id={sub.id} data-field="sortDirection" onchange={handleSubTableChange}></lightning-combobox>
                                                    </div>

                                                    <div class="slds-m-top_small" style="padding: 8px; background: #ffffff; border-radius: 6px; border: 1px dashed #cbd5e1;">
                                                        <lightning-input type="toggle" label="Auto Ajuste de Columnas" checked={sub.autoFit} data-id={sub.id} data-field="autoFit" onchange={handleSubTableChangeToggle} message-toggle-active="Activado" message-toggle-inactive="Manual"></lightning-input>
                                                        <template if:false={sub.autoFit}>
                                                            <lightning-slider class="slds-m-top_x-small" label="Ancho manual (px)" min="50" max="600" value={sub.manualWidth} data-id={sub.id} data-field="manualWidth" onchange={handleSubTableChangeSlider}></lightning-slider>
                                                        </template>
                                                    </div>

                                                    <div class="ux-section-title slds-m-top_medium" style="font-size: 9px;">Colores Exclusivos</div>
                                                    <div class="color-grid">
                                                        <lightning-input type="color" label="Fondo Head" value={sub.headerColor} data-id={sub.id} data-field="headerColor" onchange={handleSubTableChange}></lightning-input>
                                                        <lightning-input type="color" label="Texto Head" value={sub.headerTextColor} data-id={sub.id} data-field="headerTextColor" onchange={handleSubTableChange}></lightning-input>
                                                        <lightning-input type="color" label="Fondo Data" value={sub.dataColor} data-id={sub.id} data-field="dataColor" onchange={handleSubTableChange}></lightning-input>
                                                        <lightning-input type="color" label="Texto Data" value={sub.dataTextColor} data-id={sub.id} data-field="dataTextColor" onchange={handleSubTableChange}></lightning-input>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- F5: Gestión de gráficos por hoja. -->
                                        <div class="ux-card slds-m-top_medium">
                                            <div class="pivot-section-toolbar slds-m-bottom_small">
                                                <span class="ux-section-title pivot-section-toolbar__title">
                                                    <span class="section-icon"><lightning-icon icon-name="utility:chart" size="xx-small" alternative-text=""></lightning-icon></span>
                                                    <span>Gráficos</span>
                                                </span>
                                                <lightning-button
                                                    variant="neutral"
                                                    label="Añadir gráfico"
                                                    icon-name="utility:add"
                                                    onclick={openAddChartModal}
                                                    title="Crea un gráfico (barras / líneas / pastel) basado en los datos de esta hoja">
                                                </lightning-button>
                                            </div>
                                            <template if:false={hasActiveSheetCharts}>
                                                <div class="hint-box slds-m-top_small">Aún no hay gráficos en esta hoja. Pulsa «Añadir gráfico» para crear el primero.</div>
                                            </template>
                                            <template if:true={hasActiveSheetCharts}>
                                                <ul class="chart-config-list">
                                                    <template for:each={activeSheetCharts} for:item="c">
                                                        <li key={c.id} class="chart-config-item">
                                                            <div class="chart-config-item__info">
                                                                <span class="chart-config-item__title">{c.title}</span>
                                                                <span class="chart-config-item__meta">{c.typeLabel}</span>
                                                            </div>
                                                            <lightning-button-icon icon-name="utility:edit" variant="bare" size="small" alternative-text="Editar gráfico" title="Editar" data-id={c.id} onclick={openEditChartModal}></lightning-button-icon>
                                                            <lightning-button-icon icon-name="utility:delete" variant="bare" size="small" alternative-text="Eliminar gráfico" title="Eliminar" data-id={c.id} onclick={deleteChart}></lightning-button-icon>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                            <template if:true={chartjsUnavailable}>
                                                <div class="hint-box slds-m-top_small" style="background:#FEE2E2;border-color:#FCA5A5;color:#7F1D1D;">
                                                    No se pudo cargar Chart.js. Sube el Static Resource «chartjs» (archivo <code>chart.umd.js</code>) y recarga.
                                                </div>
                                            </template>
                                        </div>

                                        <div class="ux-card ux-card--blend slds-m-top_medium">
                                            <div class="ux-section-title">
                                                <span class="section-icon"><lightning-icon icon-name="utility:link" size="xx-small" alternative-text=""></lightning-icon></span>
                                                <span>Combinar otro reporte</span>
                                            </div>
                                            <p class="ux-card__lead">Crea una hoja nueva con datos de otro informe sin perder lo que ya tienes.</p>
                                            <lightning-button variant="brand-outline" label="Añadir datos de otro informe" icon-name="utility:table" onclick={openBlendModal} class="full-width-btn"></lightning-button>
                                        </div>
                                    </template>

                                    <template if:true={showPanelExportEmpty}>
                                        <div class="hint-box">
                                            Pivots y combinaciones de datos están dentro de la <strong>experiencia libro multi-hoja</strong>. Actívala en la tab <em>General</em> para acceder a estas opciones.
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </template>
                </aside>
            </div>
            </template>

            <!-- Ola 2: Vista de Exportación.
                 Solo aparece cuando activeStudioTab === 'export'. Cada tarjeta reusa los
                 handlers existentes via exportFromTab/data-action; no duplica logica. -->
            <template if:true={isStudioTabExport}>
                <section class="studio-export-view" aria-label="Acciones de exportación">
                    <div class="studio-export-view__intro">
                        <h2>Exportar este reporte</h2>
                        <p>Cuatro accesos directos para descargar tu trabajo. Las opciones que requieren tener una hoja activa quedan deshabilitadas mientras se carga el reporte.</p>
                    </div>
                    <div class="studio-export-grid">
                        <button type="button" class="export-card export-card--ppt" data-action="ppt" onclick={exportFromTab} disabled={isActionDisabled} title="Avanzar al constructor de PowerPoint con el Excel actual">
                            <span class="export-card__icon" aria-hidden="true">📊</span>
                            <h3 class="export-card__title">Generar PPT</h3>
                            <p class="export-card__desc">Abre el constructor de PowerPoint con los datos y plantilla actuales. Ideal para presentaciones.</p>
                        </button>
                        <button type="button" class="export-card export-card--excel" data-action="excel" onclick={exportFromTab} disabled={isActionDisabled} title="Descargar el reporte como archivo .xlsx con formato">
                            <span class="export-card__icon" aria-hidden="true">📗</span>
                            <h3 class="export-card__title">Exportar a Excel</h3>
                            <p class="export-card__desc">Genera un libro .xlsx con todas las hojas, formatos, pivots y totales tal y como los ves.</p>
                        </button>
                        <button type="button" class="export-card export-card--pdf" data-action="pdf" onclick={exportFromTab} disabled={isActionDisabled} title="Descargar el reporte como PDF imprimible">
                            <span class="export-card__icon" aria-hidden="true">📕</span>
                            <h3 class="export-card__title">Exportar a PDF</h3>
                            <p class="export-card__desc">Versión imprimible del reporte. Útil para compartir por correo o adjuntar a un caso.</p>
                        </button>
                        <button type="button" class="export-card export-card--config" data-action="config" onclick={exportFromTab} disabled={isActionDisabled} title="Descargar la definición del diseño en formato JSON">
                            <span class="export-card__icon" aria-hidden="true">⚙️</span>
                            <h3 class="export-card__title">Exportar configuración</h3>
                            <p class="export-card__desc">Guarda un .json con tu plantilla (columnas, formato, filtros). Puedes importarlo en otro reporte.</p>
                        </button>
                    </div>
                </section>
            </template>

        </template>

        <!-- V: Modal de gestión de variantes (CRUD + selección).
             Modo "picker" → cuando se abre automáticamente al cambiar de reporte; pide elegir antes de entrar al editor.
             Modo "manager" → cuando se abre desde el botón "Gestionar variantes" en la cabecera; ya hay variante activa. -->
        <template if:true={showVariantManagerModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="variant-manager-title" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container variant-manager-container">
                    <header class="slds-modal__header variant-manager-header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Cerrar" onclick={closeVariantManagerModal}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 id="variant-manager-title" class="slds-modal__title slds-hyphenate">{variantManagerTitle}</h2>
                        <p class="slds-m-top_x-small variant-manager-subtitle">{variantManagerSubtitle}</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium variant-manager-content">
                        <div class="variant-manager-actions">
                            <lightning-button label="Guardar config actual como variante" variant="brand" icon-name="utility:add" onclick={openVariantSaveModal} disabled={variantsBusy}></lightning-button>
                            <lightning-button label="Importar archivo .json como variante" icon-name="utility:upload" onclick={triggerImportVariantDialog} disabled={variantsBusy} title="Crea una variante nueva desde un archivo .json sin tocar la configuración que tienes abierta en el editor."></lightning-button>
                            <template if:true={currentVariantId}>
                                <lightning-button label="Editar variante activa" icon-name="utility:edit" onclick={editCurrentVariant} disabled={variantsBusy}></lightning-button>
                                <lightning-button label="Duplicar variante activa" icon-name="utility:copy" onclick={duplicateCurrentVariant} disabled={variantsBusy}></lightning-button>
                            </template>
                            <input type="file" data-id="import-variant-file" accept="application/json,.json" class="variant-import-file-input" onchange={handleImportVariantFile} />
                        </div>

                        <!-- V-SEARCH: buscador del modal de variantes. Solo aparece cuando hay 6+ variantes
                             para que no estorbe en reportes con pocas. Filtra por nombre, normalizando acentos. -->
                        <template if:true={showVariantSearch}>
                            <div class="variants-search">
                                <lightning-input
                                    type="search"
                                    label="Buscar variante por nombre"
                                    variant="label-hidden"
                                    placeholder={variantSearchPlaceholder}
                                    value={variantSearchQuery}
                                    onchange={handleVariantSearchInput}
                                    class="variants-search__input">
                                </lightning-input>
                            </div>
                        </template>

                        <template if:true={variantsBusy}>
                            <div class="loading-row"><lightning-spinner size="small"></lightning-spinner><span>Procesando…</span></div>
                        </template>

                        <template if:false={hasAnyVariants}>
                            <div class="variants-empty">
                                <span class="empty-icon-wrapper" aria-hidden="true">🗂️</span>
                                <h3>Todavía no hay variantes</h3>
                                <p>Configura el reporte como quieres y guarda tu primera variante. Después podrás cargar, duplicar o eliminar versiones.</p>
                            </div>
                        </template>

                        <template if:true={noResultsForFilter}>
                            <div class="variants-empty variants-empty--filter">
                                <span class="empty-icon-wrapper" aria-hidden="true">🔍</span>
                                <h3>Sin coincidencias</h3>
                                <p>{noResultsMessage}</p>
                                <lightning-button label="Limpiar búsqueda" onclick={clearVariantSearch} variant="neutral"></lightning-button>
                            </div>
                        </template>

                        <template if:true={hasFilteredVariants}>
                            <ul class="variants-grid">
                                <template for:each={filteredVariants} for:item="v">
                                    <li key={v.varianteId} class="variant-card">
                                        <button type="button" class="variant-card__pick-btn" data-id={v.varianteId} onclick={handlePickVariant} title="Cargar esta variante">
                                            <div class="variant-card__header">
                                                <span class="variant-card__name">{v.nombre}</span>
                                                <span class={v.badgeClass}>{v.visibilityLabel}</span>
                                            </div>
                                            <div class="variant-card__meta">
                                                <template if:true={v.esDefault}>
                                                    <span class="variant-card__pill variant-card__pill--default">DEFAULT</span>
                                                </template>
                                                <template if:true={v.isCurrent}>
                                                    <span class="variant-card__pill variant-card__pill--current">ACTIVA</span>
                                                </template>
                                                <template if:true={v.hasPpt}>
                                                    <span class="variant-card__ppt-icon" title={v.pptChipTitle} role="img" aria-label="Presentación asociada">
                                                        <lightning-icon icon-name="doctype:ppt" size="small" alternative-text="Presentación asociada"></lightning-icon>
                                                    </span>
                                                </template>
                                                <span class="variant-card__date">Modificada: {v.lastModifiedDisplay}</span>
                                                <template if:true={v.ownerUserName}>
                                                    <span class="variant-card__owner">por {v.ownerUserName}</span>
                                                </template>
                                            </div>
                                        </button>
                                        <div class="variant-card__actions">
                                            <lightning-button-icon icon-name="utility:download" variant="border" alternative-text="Descargar variante" title="Descargar esta variante como archivo .json" data-id={v.varianteId} onclick={exportVariantById} disabled={variantsBusy}></lightning-button-icon>
                                            <lightning-button-icon icon-name="utility:delete" variant="border" alternative-text="Eliminar" title="Eliminar esta variante" data-id={v.varianteId} onclick={deleteVariantById} disabled={variantsBusy}></lightning-button-icon>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <template if:true={variantManagerIsPicker}>
                            <lightning-button label="Empezar desde cero" onclick={startFreshNoVariant} title="Carga los datos del reporte sin aplicar ninguna variante. Tendrás que guardar como nueva variante para poder avanzar a PPT."></lightning-button>
                        </template>
                        <template if:false={variantManagerIsPicker}>
                            <lightning-button label="Cerrar" onclick={closeVariantManagerModal}></lightning-button>
                        </template>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={closeVariantManagerModal}></div>
        </template>

        <!-- V: Modal de guardar/editar variante (nombre, default, pública/privada). -->
        <template if:true={showVariantSaveModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="variant-save-title" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Cerrar" onclick={closeVariantSaveModal}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Cerrar"></lightning-icon>
                        </button>
                        <h2 id="variant-save-title" class="slds-modal__title slds-hyphenate">{variantSaveModalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={isImportingVariant}>
                            <div class="variant-import-hint">
                                <lightning-icon icon-name="utility:upload" size="small" alternative-text="Importar"></lightning-icon>
                                <div>
                                    <p class="slds-text-body_small"><strong>Estás creando una variante nueva desde un archivo.</strong></p>
                                    <p class="slds-text-body_small">No se modifica la configuración que tienes abierta en el editor.</p>
                                    <template if:true={importMismatchNotice}>
                                        <p class="slds-text-body_small variant-import-hint__warn">⚠ {importMismatchNotice}</p>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <lightning-input type="text" label="Nombre de la variante" value={variantSaveDraft.nombre} onchange={handleVariantSaveNombre} max-length="120" required></lightning-input>
                        <div class="slds-m-top_small">
                            <lightning-input type="checkbox" label="Marcar como variante por defecto del reporte" checked={variantSaveDraft.esDefault} onchange={handleVariantSaveDefault}></lightning-input>
                            <lightning-input type="checkbox" label="Pública (visible para todo el equipo)" checked={variantSaveDraft.esPublica} onchange={handleVariantSavePublica}></lightning-input>
                            <template if:true={isImportingVariant}>
                                <lightning-input type="checkbox" label="Activarla al guardar (reemplaza la variante actual en el editor)" checked={variantSaveDraft.activateAfterSave} onchange={handleVariantSaveActivate}></lightning-input>
                            </template>
                        </div>
                        <p class="slds-text-color_weak slds-m-top_small slds-text-body_small">
                            • Las variantes <strong>públicas</strong> son visibles y editables por cualquier usuario con acceso al reporte.<br/>
                            • Las variantes <strong>privadas</strong> solo aparecen para su creador.
                        </p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancelar" onclick={closeVariantSaveModal}></lightning-button>
                        <lightning-button label="Guardar" variant="brand" onclick={submitVariantSave} disabled={variantsBusy} class="slds-m-left_x-small"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={closeVariantSaveModal}></div>
        </template>
    </div>
</template>
