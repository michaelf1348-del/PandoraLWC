<template>
    <lightning-card title="Generador Dashboard Dinámico" icon-name="doctype:excel">
        <div class="slds-p-around_medium">
            <p class="slds-m-bottom_small">Genera la estructura visual del reporte basado en la configuración de Salesforce.</p>
            
            <lightning-button 
                variant="brand" 
                label="Generar Estructura Espejo" 
                onclick={generarExcelEspejo} 
                disabled={isGenerating}
                class="slds-button_stretch">
            </lightning-button>

            <template if:true={isGenerating}>
                <div class="slds-m-top_medium slds-is-relative" style="height: 50px;">
                    <lightning-spinner alternative-text="Generando..." size="small"></lightning-spinner>
                </div>
                <p class="slds-text-align_center slds-text-color_weak slds-m-top_small">Procesando diseño y guardando...</p>
            </template>
        </div>
    </lightning-card>
</template>
