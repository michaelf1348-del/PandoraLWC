<template>
    <!-- ===================== CONTENEDOR (estilo Related List estándar) ===================== -->
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-case">
                        <lightning-icon
                            icon-name="standard:case"
                            alternative-text="Tickets"
                            size="small">
                        </lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <a href="#" onclick={handleViewAll} class="slds-card__header-link slds-truncate">
                            <span>Tickets ({ticketCount})</span>
                        </a>
                    </h2>
                </div>
            </header>
            <div class="slds-no-flex">
                <lightning-button
                    label="Nuevo"
                    onclick={handleNewClick}>
                </lightning-button>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <template lwc:if={hasTickets}>
                <lightning-datatable
                    key-field="Id"
                    data={tickets}
                    columns={columns}
                    hide-checkbox-column
                    resize-column-disabled>
                </lightning-datatable>
            </template>
            <template lwc:else>
                <p class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                    No hay tickets para mostrar.
                </p>
            </template>
        </div>

        <footer class="slds-card__footer">
            <a href="#" onclick={handleViewAll}>Ver todos</a>
        </footer>
    </article>

    <!-- ===================== MODAL DE CREACIÓN ===================== -->
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 aria-labelledby="modal-heading-01"
                 class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Cerrar" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="Cerrar"
                                        variant="inverse" size="small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Cerrar</span>
                    </button>
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        {modalTitle}
                    </h1>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Paso 1: selección del tipo de registro -->
                    <lightning-combobox
                        name="recordType"
                        label="Tipo de Registro"
                        placeholder="Selecciona un tipo de registro"
                        options={recordTypeOptions}
                        value={selectedRecordTypeId}
                        onchange={handleRecordTypeChange}
                        required>
                    </lightning-combobox>

                    <!-- Paso 2: formulario una vez elegido el RT -->
                    <template lwc:if={isFormVisible}>
                        <div class="slds-m-top_medium">
                            <lightning-record-edit-form
                                object-api-name="Case"
                                record-type-id={selectedRecordTypeId}
                                onsubmit={handleSubmit}
                                onsuccess={handleSuccess}
                                onerror={handleError}>

                                <lightning-messages></lightning-messages>

                                <lightning-input-field field-name="Subject" required>
                                </lightning-input-field>
                                <lightning-input-field field-name="Status">
                                </lightning-input-field>
                                <lightning-input-field field-name="Priority">
                                </lightning-input-field>
                                <lightning-input-field field-name="Origin">
                                </lightning-input-field>
                                <lightning-input-field field-name="Description">
                                </lightning-input-field>

                                <!--
                                    AccountId NO se renderiza aquí:
                                    se inyecta en handleSubmit() para forzar la
                                    relación con la cuenta padre, incluso si el
                                    usuario lo modificara desde la UI.
                                -->

                                <footer class="slds-m-top_medium slds-text-align_right">
                                    <lightning-button
                                        label="Cancelar"
                                        onclick={handleCloseModal}
                                        class="slds-m-right_x-small">
                                    </lightning-button>
                                    <lightning-button
                                        variant="brand"
                                        type="submit"
                                        label="Guardar"
                                        disabled={isSaving}>
                                    </lightning-button>
                                </footer>
                            </lightning-record-edit-form>
                        </div>
                    </template>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
